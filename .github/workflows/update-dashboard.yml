name: update-yipin-dashboard
on:
  schedule:
      - cron: '0 1 * * 3'
        workflow_dispatch:
        permissions:
          contents: write
          jobs:
            inject:
                runs-on: ubuntu-latest
                    steps:
                          - uses: actions/checkout@v4
                                - uses: actions/setup-python@v5
                                        with:
                                                  python-version: '3.11'
                                                        - name: normalize layout
                                                                run: |
                                                                          mkdir -p scripts data
                                                                                    if [ -f inject.py ]; then mv -f inject.py scripts/inject.py; fi
                                                                                              if [ -f yipin_data.json ]; then mv -f yipin_data.json data/yipin_data.json; fi
                                                                                                        rm -f yipin-patch.js update-dashboard.yml
                                                                                                              - name: inject data into index.html
                                                                                                                      run: python scripts/inject.py
                                                                                                                            - name: commit
                                                                                                                                    run: |
                                                                                                                                              git config user.name github-actions
                                                                                                                                                        git config user.email actions@github.com
                                                                                                                                                                  git add -A
                                                                                                                                                                            if git diff --cached --quiet; then
                                                                                                                                                                                        echo "no change"
                                                                                                                                                                                                  else
                                                                                                                                                                                                              git commit -m "auto update dashboard data"
                                                                                                                                                                                                                          git push
                                                                                                                                                                                                                                    fi
                                                                                                                                                                                                                                    
