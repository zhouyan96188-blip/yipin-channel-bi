name: 更新逸品看板数据

# 每周三 09:00（北京时间）自动跑；也可以在 Actions 页面手动点「Run workflow」
on:
  schedule:
    - cron: '0 1 * * 3'      # UTC 01:00 = 北京 09:00，每周三
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 把 data/yipin_data.json 注入 index.html
        run: python scripts/inject.py

      - name: 有改动就提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "index.html 无变化，跳过提交"
          else
            git add index.html
            git commit -m "自动更新看板数据 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi
